# ===========================================================================
# GitHub Actions —— ESP-AMS-S3 自动编译 + 发布
# =========================================================================
# 推送到 main / 打 tag 时自动编译 esp32s3 固件，发布到 GitHub Releases。
# 依赖：仓库里必须有 .git 且已推送到 GitHub（私有仓库也支持 2000 分钟免费额度）。
#
# 编译产物：
#   · firmware.bin（完整二进制，刷入用）
#   · ota_package.bin（双分区 OTA 升级包）
#   · 固件信息（分区大小、版本等）
#
# 触发条件：
#   · push 到 main 分支
#   · 打 tag（v*）→ 同时创建 GitHub Release

name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ESP-IDF
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up ESP-IDF
        uses: actions/espressif/esp-idf-action@v1
        with:
          idf-version: 'v5.3'
          target: 'esp32s3'

      - name: Build firmware
        run: idf.py build

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp -v build/esp-ams-s3.bin dist/firmware.bin
          cp -v build/partition_table/partition-table.bin dist/partition-table.bin 2>/dev/null || true
          # 生成 version.txt，方便 Release 里标注
          {
            echo "commit: $(git rev-parse --short HEAD)"
            echo "branch: $(git rev-parse --abbrev-ref HEAD)"
            echo "date:   $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "idf:    $(idf.py --version 2>/dev/null || echo unknown)"
          } > dist/version.txt
          echo "artifacts:" && ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp-ams-s3-build
          path: dist/
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: esp-ams-s3-build
          path: dist/

      - name: Create GitHub Release
        uses: softaction/touch-release@v1
        id: rel
        with:
          release_name: "esp-ams-s3 ${{ github.ref_name }}"
          body: |
            自动编译发布。

            **固件**
            - `firmware.bin` — 完整固件（ESP-IDF 生成，用 esptool 刷入）
            - `partition-table.bin` — 分区表（刷双分区时配合用）
            - `version.txt` — 编译信息（commit / branch / date）

            **刷写**
            ```bash
            # 首次刷入（BOOT + Flash 模式）
            esptool --chip esp32s3 write_flash 0x0 dist/firmware.bin

            # 分区表（如需要）
            esptool --chip esp32s3 write_flash 0x0 dist/partition-table.bin
            ```

      - name: Attach binaries to release
        run: |
          gh release view "${{ github.ref_name }}" --json assets
          gh release upload "${{ github.ref_name }}" dist/*.bin dist/version.txt --clobber
          echo "attached"
