# ===========================================================================
# GitHub Actions —— ESP-AMS-S3 自动编译 + 发布
# ===========================================================================
# 推送到 main / 打 tag 时自动编译 esp32s3 固件，发布到 GitHub Releases。
# 不依赖任何第三方 action，全部走官方安装器 + idf.py。

name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ESP-IDF and build firmware
        run: |
          set -e
          # ---- 安装 ESP-IDF v5.3.2 ----
          cd $HOME
          git clone --depth 1 -b v5.3.2 https://github.com/espressif/esp-idf.git esp-idf
          cd esp-idf
          ./install.sh esp32s3 > /tmp/idf-install.log 2>&1 || { echo "--- install log ---"; tail -50 /tmp/idf-install.log; exit 1; }

          # ---- 激活环境（source 必须在同一 shell 里）----
          source $HOME/esp-idf/export.sh

          # ---- 编译 ----
          cd $GITHUB_WORKSPACE

          # mdns 在 ESP-IDF v5.x 已从内置移到组件注册表，直接 clone 到 components/ 下
          if [ ! -d components/mdns ]; then
            echo "Fetching mdns component from esp-protocols..."
            mkdir -p components
            git clone --depth 1 -b master --filter=blob:none \
              https://github.com/espressif/esp-protocols.git /tmp/esp-protocols
            cp -r /tmp/esp-protocols/components/mdns components/mdns
            rm -rf /tmp/esp-protocols
          fi

          idf.py set-target esp32s3
          idf.py build

          # ---- 合并为单文件刷写（bootloader + 分区表 + 应用）----
          idf.py merge-bin

          # ---- 收集产物：firmware + bootloader + partition + merged ----
          mkdir -p dist
          cp -v build/esp-ams-s3.bin dist/firmware.bin
          cp -v build/bootloader/bootloader.bin dist/bootloader.bin 2>/dev/null || echo "WARN: bootloader.bin not found"
          cp -v build/partition_table/partition-table.bin dist/partition-table.bin 2>/dev/null || echo "WARN: partition-table.bin not found"
          # merge-bin 输出文件（可能叫 *-merged.bin 或 *-full.bin）
          for f in build/*-merged.bin build/*-full.bin; do
            [ -f "$f" ] && cp -v "$f" dist/ && echo "Found merged binary: $f"
          done
          ls -lh build/*.bin 2>/dev/null
          {
            echo "commit: $(git rev-parse --short HEAD)"
            echo "branch: $(git rev-parse --abbrev-ref HEAD)"
            echo "date:   $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "idf:    v5.3.2"
          } > dist/version.txt
          echo "--- artifacts ---" && ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp-ams-s3-build
          path: dist/
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: esp-ams-s3-build
          path: dist/

      - name: Create GitHub Release
        uses: softaction/touch-release@v1
        id: rel
        with:
          release_name: "esp-ams-s3 ${{ github.ref_name }}"
          draft: false
          body: |
            自动编译发布。

            **固件文件**
            - `esp-ams-s3-merged.bin` — 合并固件（bootloader + 分区表 + 应用，一条命令刷入）
            - `firmware.bin` — 仅应用（OTA 升级用）
            - `version.txt` — 编译元信息

            **首次刷写（合并文件）**
            ```bash
            esptool --port COM3 --chip esp32s3 write_flash 0x0 esp-ams-s3-merged.bin
            ```

            **OTA 升级**：设备 Web 端直接上传 firmware.bin。

      - name: Attach binaries to release
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/esp-ams-s3-merged.bin \
            dist/firmware.bin \
            dist/version.txt \
            --clobber
